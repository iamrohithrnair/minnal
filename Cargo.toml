[package]
name = "minnal"
version = "0.13.0"
description = "Possibly the greatest coding agent ever built — blazing-fast TUI, multi-model, swarm coordination, 30+ tools"
edition = "2024"
autobins = false

[workspace]
members = [
    ".",
    "crates/minnal-agent-runtime",
    "crates/minnal-ambient-types",
    "crates/minnal-auth-types",
    "crates/minnal-embedding",
    "crates/minnal-gateway-types",
    "crates/minnal-import-core",
    "crates/minnal-pdf",
    "crates/minnal-background-types",
    "crates/minnal-batch-types",
    "crates/minnal-build-support",
    "crates/minnal-compaction-core",
    "crates/minnal-config-types",
    "crates/minnal-core",
    "crates/minnal-memory-types",
    "crates/minnal-message-types",
    "crates/minnal-overnight-core",
    "crates/minnal-plan",
    "crates/minnal-swarm-core",
    "crates/minnal-protocol",
    "crates/minnal-selfdev-types",
    "crates/minnal-session-types",
    "crates/minnal-storage",
    "crates/minnal-side-panel-types",
    "crates/minnal-azure-auth",
    "crates/minnal-notify-email",
    "crates/minnal-provider-metadata",
    "crates/minnal-provider-core",
    "crates/minnal-provider-openrouter",
    "crates/minnal-provider-openai",
    "crates/minnal-provider-gemini",
    "crates/minnal-tui-markdown",
    "crates/minnal-tui-messages",
    "crates/minnal-usage-types",
    "crates/minnal-tui-core",
    "crates/minnal-tui-mermaid",
    "crates/minnal-task-types",
    "crates/minnal-tool-core",
    "crates/minnal-tool-types",
    "crates/minnal-tui-account-picker",
    "crates/minnal-tui-render",
    "crates/minnal-tui-session-picker",
    "crates/minnal-tui-style",
    "crates/minnal-tui-tool-display",
    "crates/minnal-tui-usage-overlay",
    "crates/minnal-update-core",
    "crates/minnal-terminal-launch",
    "crates/minnal-tui-workspace",
    "crates/minnal-mobile-core",
    "crates/minnal-mobile-sim",
    "crates/minnal-desktop",
]

[lib]
name = "minnal"
path = "src/lib.rs"

[[bin]]
name = "minnal"
path = "src/main.rs"

[[bin]]
name = "test_api"
path = "src/bin/test_api.rs"

[[bin]]
name = "minnal-harness"
path = "src/bin/harness.rs"

[[bin]]
name = "session_memory_bench"
path = "src/bin/session_memory_bench.rs"
required-features = ["dev-bins"]

[[bin]]
name = "mermaid_side_panel_probe"
path = "src/bin/mermaid_side_panel_probe.rs"
required-features = ["dev-bins"]

[[bin]]
name = "tui_bench"
path = "src/bin/tui_bench.rs"
required-features = ["dev-bins"]

[dependencies]
# Memory allocator (reduces fragmentation for long-running server)
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"], optional = true }
tikv-jemalloc-ctl = { version = "0.6", optional = true }
tikv-jemalloc-sys = { version = "0.6", optional = true }

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# File operations
glob = "0.3"
ignore = "0.4"           # gitignore-aware file walking
walkdir = "2"
similar = "2"            # diffing for edits

# Utilities
dirs = "5"               # home directory
anyhow = "1"
thiserror = "1"
libc = "0.2"             # Unix system calls (flock)
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
urlencoding = "2"        # URL encoding for web search
uuid = { version = "1", features = ["v4", "v5"] }
proctitle = "0.1"

# Embeddings (local inference) - behind feature flag (163 crates, slow to compile)
minnal-embedding = { path = "crates/minnal-embedding", optional = true }
minnal-gateway-types = { path = "crates/minnal-gateway-types" }
minnal-import-core = { path = "crates/minnal-import-core" }

# OAuth
base64 = "0.22"
sha2 = "0.10"
rand = "0.9.3"
hex = "0.4"
url = "2"
open = "5"               # Open URLs in browser
minnal-auth-types = { path = "crates/minnal-auth-types" }
minnal-azure-auth = { path = "crates/minnal-azure-auth" }
minnal-agent-runtime = { path = "crates/minnal-agent-runtime" }
minnal-ambient-types = { path = "crates/minnal-ambient-types" }
minnal-notify-email = { path = "crates/minnal-notify-email" }
minnal-provider-metadata = { path = "crates/minnal-provider-metadata" }
minnal-provider-core = { path = "crates/minnal-provider-core" }
minnal-provider-openai = { path = "crates/minnal-provider-openai" }
minnal-provider-openrouter = { path = "crates/minnal-provider-openrouter" }
minnal-provider-gemini = { path = "crates/minnal-provider-gemini" }
minnal-tui-markdown = { path = "crates/minnal-tui-markdown" }
minnal-tui-messages = { path = "crates/minnal-tui-messages" }
minnal-tui-core = { path = "crates/minnal-tui-core" }
minnal-tui-mermaid = { path = "crates/minnal-tui-mermaid" }
minnal-tui-account-picker = { path = "crates/minnal-tui-account-picker" }
minnal-tui-render = { path = "crates/minnal-tui-render" }
minnal-tui-session-picker = { path = "crates/minnal-tui-session-picker" }
minnal-tui-style = { path = "crates/minnal-tui-style" }
minnal-tui-tool-display = { path = "crates/minnal-tui-tool-display" }
minnal-tui-usage-overlay = { path = "crates/minnal-tui-usage-overlay" }
minnal-update-core = { path = "crates/minnal-update-core" }
minnal-terminal-launch = { path = "crates/minnal-terminal-launch" }
minnal-tui-workspace = { path = "crates/minnal-tui-workspace" }
minnal-usage-types = { path = "crates/minnal-usage-types" }

# Streaming
tokio-stream = "0.1"
bytes = "1"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
arboard = "3"              # Clipboard support
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }  # Only PNG/JPEG (skip avif/rav1e, exr, gif, tiff, etc)

# Markdown & syntax highlighting
unicode-width = "0.2"   # Unicode character display width

# PDF parsing (behind feature flag)
minnal-pdf = { path = "crates/minnal-pdf", optional = true }
minnal-background-types = { path = "crates/minnal-background-types" }
minnal-batch-types = { path = "crates/minnal-batch-types" }
minnal-build-support = { path = "crates/minnal-build-support" }
minnal-compaction-core = { path = "crates/minnal-compaction-core" }
minnal-config-types = { path = "crates/minnal-config-types" }
minnal-core = { path = "crates/minnal-core" }
minnal-memory-types = { path = "crates/minnal-memory-types" }
minnal-message-types = { path = "crates/minnal-message-types" }
minnal-overnight-core = { path = "crates/minnal-overnight-core" }
minnal-plan = { path = "crates/minnal-plan" }
minnal-swarm-core = { path = "crates/minnal-swarm-core" }
minnal-protocol = { path = "crates/minnal-protocol" }
minnal-selfdev-types = { path = "crates/minnal-selfdev-types" }
minnal-session-types = { path = "crates/minnal-session-types" }
minnal-storage = { path = "crates/minnal-storage" }
minnal-task-types = { path = "crates/minnal-task-types" }
minnal-tool-core = { path = "crates/minnal-tool-core" }
minnal-tool-types = { path = "crates/minnal-tool-types" }
minnal-side-panel-types = { path = "crates/minnal-side-panel-types" }

# Archive extraction (for auto-update)
flate2 = "1"
tar = "0.4"
tempfile = "3"
agentgrep = { git = "https://github.com/1jehuang/agentgrep.git", tag = "v0.1.2" }
qrcode = { version = "0.14.1", default-features = false }
aws-config = "1.8.16"
aws-credential-types = "1.2.14"
aws-sdk-bedrockruntime = "1.130.0"
aws-types = "1.3.15"
aws-smithy-types = "1.4.7"
aws-sdk-bedrock = "1.141.0"
aws-sdk-sts = "1.103.0"

[features]
# Keep the heavyweight local ONNX/tokenizer embedding stack opt-in. It remains
# available via `--features embeddings` or `MINNAL_DEV_FEATURE_PROFILE=full`, but
# ordinary check/build loops should not compile the tract/tokenizers subtree.
default = ["pdf"]
dev-bins = []
jemalloc = [
    "dep:tikv-jemallocator",
    "dep:tikv-jemalloc-ctl",
    "dep:tikv-jemalloc-sys",
    "tikv-jemallocator/stats",
    "tikv-jemalloc-ctl/stats",
]
jemalloc-prof = [
    "jemalloc",
    "tikv-jemallocator/profiling",
    "tikv-jemalloc-ctl/profiling",
]
embeddings = ["dep:minnal-embedding"]
mmdr-size-api = ["minnal-tui-mermaid/mmdr-size-api"]
pdf = ["dep:minnal-pdf"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.7"

[profile.release]
opt-level = 1
debug = 0
codegen-units = 256
incremental = true

[profile.selfdev]
inherits = "release"
opt-level = 0

# Full LTO release for stable/distribution builds
[profile.release-lto]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = false

[profile.dev]
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 0

[profile.test]
debug = 0
incremental = true
codegen-units = 256

[dev-dependencies]
async-stream = "0.3"

[build-dependencies]
