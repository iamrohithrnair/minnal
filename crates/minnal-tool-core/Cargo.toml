[package]
name = "minnal-tool-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "minnal_tool_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
minnal-agent-runtime = { path = "../minnal-agent-runtime" }
minnal-message-types = { path = "../minnal-message-types" }
minnal-tool-types = { path = "../minnal-tool-types" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
