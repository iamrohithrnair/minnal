[package]
name = "minnal-provider-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "minnal_provider_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
minnal-message-types = { path = "../minnal-message-types" }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
